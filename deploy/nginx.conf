# publish the map and authenticated admin on one origin
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    # keep the origin private to the tunnel connector
    server {
        listen 127.0.0.1:8080;
        server_name adsb.ballydidean.farm;
        # preserve the public HTTPS origin through tunnel redirects
        absolute_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location = / { return 302 /map/; }
        location = /map { return 302 /map/; }
        # strip only the fixed map prefix
        location /map/ {
            proxy_pass http://127.0.0.1:8078/;
            proxy_set_header Host $host;
        }
        # forward the admin shell, assets and API without exposing decoder ports
        location ~ ^/(admin/?|admin\.js|styles\.css|api(?:/.*)?|healthz)$ {
            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_buffering off;
        }
        # preserve map assets that use absolute URLs
        location / {
            proxy_pass http://127.0.0.1:8078;
            proxy_set_header Host $host;
        }
    }
}
